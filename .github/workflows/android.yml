name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11 (Required for Pygame/Android compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libgdbm-dev \
            libssl-dev libffi-dev liblzma-dev build-essential
          pip install --upgrade pip setuptools wheel
          pip install git+https://github.com/kivy/buildozer.git
          pip install "cython<3.0" virtualenv

      - name: Setup Android SDK, NDK and AIDL fix
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "ndk;25.2.9519653"
          
          # Устраняем ошибку "Aidl not found" раз и навсегда
          sudo cp /usr/local/lib/android/sdk/build-tools/33.0.2/aidl /usr/local/bin/aidl
          sudo chmod +x /usr/local/bin/aidl
          echo "/usr/local/lib/android/sdk/build-tools/33.0.2" >> $GITHUB_PATH

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Capuchinator-APK
          path: bin/*.apk
